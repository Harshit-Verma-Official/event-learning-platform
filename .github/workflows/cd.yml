name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image variables
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Auth image
        run: |
          docker build \
            -f services/auth-service/Dockerfile \
            -t ghcr.io/${{ steps.vars.outputs.owner }}/event-learning-platform-auth:${{ steps.vars.outputs.tag }} \
            .

      - name: Build Course image
        run: |
          docker build \
            -f services/course-service/Dockerfile \
            -t ghcr.io/${{ steps.vars.outputs.owner }}/event-learning-platform-course:${{ steps.vars.outputs.tag }} \
            .

      - name: Build Notification image
        run: |
          docker build \
            -f services/notification-service/Dockerfile \
            -t ghcr.io/${{ steps.vars.outputs.owner }}/event-learning-platform-notification:${{ steps.vars.outputs.tag }} \
            .

      - name: Build Analytics image
        run: |
          docker build \
            -f services/analytics-service/Dockerfile \
            -t ghcr.io/${{ steps.vars.outputs.owner }}/event-learning-platform-analytics:${{ steps.vars.outputs.tag }} \
            .

      - name: Push Auth image
        run: |
          docker push \
            ghcr.io/${{ steps.vars.outputs.owner }}/event-learning-platform-auth:${{ steps.vars.outputs.tag }}

      - name: Push Course image
        run: |
          docker push \
            ghcr.io/${{ steps.vars.outputs.owner }}/event-learning-platform-course:${{ steps.vars.outputs.tag }}

      - name: Push Notification image
        run: |
          docker push \
            ghcr.io/${{ steps.vars.outputs.owner }}/event-learning-platform-notification:${{ steps.vars.outputs.tag }}

      - name: Push Analytics image
        run: |
          docker push \
            ghcr.io/${{ steps.vars.outputs.owner }}/event-learning-platform-analytics:${{ steps.vars.outputs.tag }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -e

            cd ~/event-learning-platform

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin

            export IMAGE_TAG="$IMAGE_TAG"

            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              pull

            echo "Running Auth migrations..."
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              run --rm auth-migration

            echo "Running Course migrations..."
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              run --rm course-migration

            echo "Running Notification migrations..."
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              run --rm notification-migration

            echo "Running Analytics migrations..."
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              run --rm analytics-migration

            echo "Starting application..."
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              up -d

            echo "Deployment status:"
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              ps
